name: QA Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: Test target
        required: true
        default: api
        type: choice
        options: [api, ui]
      environment:
        description: Test environment name
        required: true
        default: dev
        type: string

permissions:
  contents: read
  id-token: write

env:
  QA_ARTIFACT_ROOT: test-artifacts
  QA_TEST_TARGET: ${{ inputs.target }}
  QA_ENVIRONMENT: ${{ inputs.environment }}

jobs:
  api:
    if: inputs.target == 'api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: automation-framework/go.mod

      - name: Prepare artifact workspace
        run: python3 scripts/ci/prepare_test_artifacts.py

      - name: Run API tests
        id: api-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd tests/api
          go test -json ./... 2>&1 | tee ../../test-artifacts/reports/api-test-results.json | tee ../../test-artifacts/logs/api-test.log

      - name: Record API execution status
        if: always()
        run: |
          printf '%s\n' '${{ steps.api-tests.outcome }}' > test-artifacts/debug_info/test-outcome.txt

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Fail job when API tests failed
        if: steps.api-tests.outcome == 'failure'
        run: exit 1

  ui:
    if: inputs.target == 'ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare artifact workspace
        run: python3 scripts/ci/prepare_test_artifacts.py

      - name: Install UI test dependencies
        working-directory: tests/ui
        run: npm install

      - name: Install Playwright browser
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        id: ui-tests
        continue-on-error: true
        working-directory: tests/ui
        env:
          UI_BASE_URL: ${{ vars.UI_BASE_URL }}
          PLAYWRIGHT_STORAGE_STATE: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_PATH }}
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../../test-artifacts/logs/playwright.log

      - name: Collect UI artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p test-artifacts/reports test-artifacts/cases test-artifacts/debug_info
          cp tests/ui/test-results/junit.xml test-artifacts/reports/junit.xml 2>/dev/null || true
          cp -R tests/ui/playwright-report test-artifacts/reports/playwright-html 2>/dev/null || true
          cp -R tests/ui/test-results/. test-artifacts/cases/ 2>/dev/null || true
          printf '%s\n' '${{ steps.ui-tests.outcome }}' > test-artifacts/debug_info/test-outcome.txt

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Fail job when UI tests failed
        if: steps.ui-tests.outcome == 'failure'
        run: exit 1
