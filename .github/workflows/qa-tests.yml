name: QA Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: Test target
        required: true
        default: api
        type: choice
        options: [api]

permissions:
  contents: read
  id-token: write

jobs:
  api:
    if: inputs.target == 'api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: automation-framework/go.mod
      - name: Run API tests
        working-directory: tests/api
        run: go test -json ./... | tee test-results.json
      - name: Upload raw test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: tests/api/test-results.json
